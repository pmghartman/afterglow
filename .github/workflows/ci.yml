# the TypeScript client (src/) typed, formatted and tested, and the host's link framing
# (host/src/phos_wire.h) built and tested on its own: on every push to main, every pull
# request, and before each release (release.yml calls this). The host's full Windows
# build is host.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun test

  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: mkdir -p build && c++ -std=c++20 -Wall -Wextra -Werror -Ihost/src host/test/wire_test.cpp -o build/wire_test && ./build/wire_test
