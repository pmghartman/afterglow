# manual release, as phosphorus's, and the repo's only workflow: vVERSION, one past the
# highest vMAJOR.MINOR tag (minor, or major with .0). The client's checks and tests, the
# host built on Windows, then a GitHub release with
# afterglow-VERSION-windows-x86_64.zip, its SHA256SUMS and a build provenance
# attestation. "Build only" stops before publishing: a way to try the Windows build.
# The SudoVDA driver isn't in Apollo's tree: its signed package and nefconc.exe come out
# of Apollo's release installer at APOLLO_TAG, checked against the driver's catalog
name: release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Bump Major Version"
        type: boolean
        default: false
      build_only:
        description: "Build only, publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

# one release at a time: the next version is read off the tags
concurrency:
  group: release
  cancel-in-progress: false

env:
  APOLLO_REPO: ClassicOldSong/Apollo
  APOLLO_TAG: v0.4.8
  # the installer's checksum once known; empty, it's printed for pinning
  APOLLO_INSTALLER_SHA256: ""

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          L=$(git ls-remote --tags origin | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\)$|\1|p' | sort -t. -k1,1n -k2,2n | tail -1)
          L=${L:-0.0}
          if [ "$MAJOR" = true ]; then V=$(( ${L%.*} + 1 )).0
          else V=${L%.*}.$(( ${L#*.} + 1 ))
          fi
          echo "ver=$V" | tee -a "$GITHUB_OUTPUT"

  # the client typed, formatted and tested, the host's link framing built and run
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun test
      - run: bun run test:wire

  # the host, built on Windows in MSYS2 UCRT64
  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann_json
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
      - name: build
        env:
          VER: ${{ needs.version.outputs.ver }}
        run: host/scripts/build.sh "$PWD/afterglow-out" "$VER"
      # the driver package and its installer tool, out of Apollo's release
      - name: virtual display driver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = Join-Path $env:RUNNER_TEMP 'apollo'
          New-Item -ItemType Directory -Force $dl | Out-Null
          gh release download $env:APOLLO_TAG -R $env:APOLLO_REPO -p '*.exe' -D $dl --clobber
          $setup = Get-ChildItem $dl -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer in $env:APOLLO_REPO $env:APOLLO_TAG" }
          $sum = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "$($setup.Name) sha256 $sum"
          if ($env:APOLLO_INSTALLER_SHA256 -and $sum -ne $env:APOLLO_INSTALLER_SHA256) { throw "checksum mismatch: $sum" }
          $x = Join-Path $dl 'x'
          7z x -y "-o$x" $setup.FullName | Out-Null
          $inf = Get-ChildItem $x -Recurse -Filter SudoVDA.inf | Select-Object -First 1
          if (-not $inf) { Get-ChildItem $x -Recurse | Select-Object -First 80 FullName; throw 'no SudoVDA.inf in the installer' }
          $src = $inf.Directory.FullName
          $nef = Get-ChildItem $x -Recurse -Filter nefconc.exe | Select-Object -First 1
          if (-not $nef) { throw 'no nefconc.exe in the installer' }
          $dst = Join-Path $env:GITHUB_WORKSPACE 'afterglow-out\drivers\sudovda'
          foreach ($f in 'SudoVDA.inf', 'sudovda.cat', 'sudovda.cer', 'SudoVDA.dll') {
            $p = Get-ChildItem $src -Filter $f | Select-Object -First 1
            if (-not $p) { throw "no $f beside SudoVDA.inf" }
            Copy-Item $p.FullName (Join-Path $dst $p.Name)
          }
          Copy-Item $nef.FullName $dst
          # the DLL and INF the catalog signs, and no others: trusted here as the installer trusts it
          certutil -addstore -f root (Join-Path $dst 'sudovda.cer') | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like '*x64*' | Sort-Object FullName | Select-Object -Last 1
          foreach ($f in 'SudoVDA.dll', 'SudoVDA.inf') {
            & $signtool.FullName verify /pa /c (Join-Path $dst 'sudovda.cat') (Join-Path $dst $f)
            if ($LASTEXITCODE -ne 0) { throw "$f doesn't match the signed catalog" }
          }
          Get-ChildItem $dst | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: afterglow-windows-x86_64
          path: afterglow-out/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, check, windows]
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: afterglow-windows-x86_64
          path: stage
      - name: zip
        run: |
          mkdir -p out
          ZIP=afterglow-$VER-windows-x86_64.zip
          (cd stage && zip -qr9 "../out/$ZIP" .)
          (cd out && sha256sum "$ZIP" > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/afterglow-${{ env.VER }}-windows-x86_64.zip
      # how to use this version, GitHub's list of what changed under it
      - name: notes
        run: |
          {
            echo "**Client:** \`\"@phosphorus/afterglow\": \"github:$GITHUB_REPOSITORY#v$VER\"\`"
            echo
            echo "**Host:** \`afterglow-$VER-windows-x86_64.zip\`, verified with:"
            echo
            echo '```bash'
            echo "gh attestation verify afterglow-$VER-windows-x86_64.zip --repo $GITHUB_REPOSITORY"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ env.VER }}
          name: afterglow ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: out/*
