# manual release, as phosphorus's, and the repo's only workflow: vVERSION, one past the
# highest vMAJOR.MINOR tag (minor, or major with .0). The client's checks and tests, the
# Rust host's tests and its end-to-end run on Linux, the host built and smoke-run on
# Windows and built for Linux, then a GitHub release with
# afterglow-VERSION-windows-x86_64.zip, afterglow-VERSION-linux-x86_64.tar.gz, their
# SHA256SUMS and build provenance attestations. "Build only" stops before publishing:
# a way to try the Windows build. The SudoVDA driver isn't built here: its signed
# package and nefconc.exe come out of Apollo's release installer at APOLLO_TAG, checked
# against the driver's catalog. Every run ends by purging the repo's Actions caches
# and artifacts (the purge job)
name: release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Bump Major Version"
        type: boolean
        default: false
      build_only:
        description: "Build only, publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

# one release at a time: the next version is read off the tags
concurrency:
  group: release
  cancel-in-progress: false

env:
  APOLLO_REPO: ClassicOldSong/Apollo
  APOLLO_TAG: v0.4.6
  # Apollo-0.4.6.exe; its SudoVDA 1.10.9.289 package verified against its catalog
  APOLLO_INSTALLER_SHA256: 42b2aefaacb3474511517a56b96ee9f0517f30ac38b5dd2fda9fd5b478f5021a

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # a tag pushed by hand with no release yet is released as it is, from its commit;
      # otherwise the next version, from this run's commit
      - id: v
        env:
          MAJOR: ${{ inputs.major }}
          GH_TOKEN: ${{ github.token }}
        run: |
          L=$(git ls-remote --tags origin | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\)$|\1|p' | sort -t. -k1,1n -k2,2n | tail -1)
          if [ -n "$L" ] && ! gh release view "v$L" >/dev/null 2>&1; then
            # the tag's commit (an annotated tag's ^{} line sorts after it)
            V=$L REF=$(git ls-remote origin "refs/tags/v$L" "refs/tags/v$L^{}" | sort -k2 | tail -1 | cut -f1)
          else
            L=${L:-0.0} REF=$GITHUB_SHA
            if [ "$MAJOR" = true ]; then V=$(( ${L%.*} + 1 )).0
            else V=${L%.*}.$(( ${L#*.} + 1 ))
            fi
          fi
          echo "ver=$V" | tee -a "$GITHUB_OUTPUT"
          echo "ref=$REF" | tee -a "$GITHUB_OUTPUT"

  # the client typed, formatted and tested; the host linted and tested, then run for
  # real on Xvfb and driven by the client: xterm launched, streamed, typed into, quit
  check:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # nothing kept in the Actions cache: the purge job clears it after each run
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun test
      - name: tools for the host's end-to-end run
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xterm ffmpeg nasm
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - run: cargo fmt --manifest-path host/Cargo.toml --check
      - run: cargo clippy --manifest-path host/Cargo.toml --locked --all-targets -- -D warnings
      - run: bun run test:host
      - run: bun run test:e2e

  # the host, built and tested on Windows, then run as a plain process and driven over
  # its link: notepad launched, a video's config and first frame. The runner has no GPU
  # and no SudoVDA, so that's Microsoft's basic display and software encoder; a runner
  # without Media Foundation or a desktop to duplicate fails it, which doesn't stop the build
  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # nothing kept in the Actions cache: the purge job clears it after each run
          no-cache: true
      - run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - run: cargo clippy --manifest-path host/Cargo.toml --locked --all-targets -- -D warnings
      - name: build
        env:
          VER: ${{ needs.version.outputs.ver }}
        run: bash host/scripts/stage.sh "$PWD/afterglow-out" "$VER"
      - name: smoke run
        continue-on-error: true
        run: bun test/e2e/windows-smoke.ts afterglow-out
      # the driver package and its installer tool, out of Apollo's release
      - name: virtual display driver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = Join-Path $env:RUNNER_TEMP 'apollo'
          New-Item -ItemType Directory -Force $dl | Out-Null
          gh release download $env:APOLLO_TAG -R $env:APOLLO_REPO -p '*.exe' -D $dl --clobber
          $setup = Get-ChildItem $dl -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer in $env:APOLLO_REPO $env:APOLLO_TAG" }
          $sum = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "$($setup.Name) sha256 $sum"
          if ($env:APOLLO_INSTALLER_SHA256 -and $sum -ne $env:APOLLO_INSTALLER_SHA256) { throw "checksum mismatch: $sum" }
          $x = Join-Path $dl 'x'
          7z x -y "-o$x" $setup.FullName | Out-Null
          $inf = Get-ChildItem $x -Recurse -Filter SudoVDA.inf | Select-Object -First 1
          if (-not $inf) { Get-ChildItem $x -Recurse | Select-Object -First 80 FullName; throw 'no SudoVDA.inf in the installer' }
          $src = $inf.Directory.FullName
          $nef = Get-ChildItem $x -Recurse -Filter nefconc.exe | Select-Object -First 1
          if (-not $nef) { throw 'no nefconc.exe in the installer' }
          $dst = Join-Path $env:GITHUB_WORKSPACE 'afterglow-out\drivers\sudovda'
          foreach ($f in 'SudoVDA.inf', 'sudovda.cat', 'sudovda.cer', 'SudoVDA.dll') {
            $p = Get-ChildItem $src -Filter $f | Select-Object -First 1
            if (-not $p) { throw "no $f beside SudoVDA.inf" }
            Copy-Item $p.FullName (Join-Path $dst $p.Name)
          }
          Copy-Item $nef.FullName $dst
          # the DLL and INF the catalog signs, and no others: trusted here as the installer trusts it
          certutil -addstore -f root (Join-Path $dst 'sudovda.cer') | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like '*x64*' | Sort-Object FullName | Select-Object -Last 1
          foreach ($f in 'SudoVDA.dll', 'SudoVDA.inf') {
            & $signtool.FullName verify /pa /c (Join-Path $dst 'sudovda.cat') (Join-Path $dst $f)
            if ($LASTEXITCODE -ne 0) { throw "$f doesn't match the signed catalog" }
          }
          Get-ChildItem $dst | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: afterglow-windows-x86_64
          path: afterglow-out/
          if-no-files-found: error
          retention-days: 1

  # the Linux host, built on Debian bookworm so its glibc (2.36) runs on older distros
  # than the runner's; for x86-64 and for arm64, each on a runner of its own
  linux:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: rust:1-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 1
      - run: apt-get update -qq && apt-get install -y -qq nasm
      - name: build
        env:
          VER: ${{ needs.version.outputs.ver }}
        run: bash host/scripts/stage.sh "$PWD/afterglow-out" "$VER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: afterglow-linux-${{ matrix.arch }}
          path: afterglow-out/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, check, windows, linux]
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: afterglow-windows-x86_64
          path: stage/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: afterglow-linux-x86_64
          path: stage/linux-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: afterglow-linux-aarch64
          path: stage/linux-aarch64
      - name: package
        run: |
          mkdir -p out
          (cd stage/windows && zip -qr9 "../../out/afterglow-$VER-windows-x86_64.zip" .)
          for a in x86_64 aarch64; do
            # the executable bit, which artifacts don't keep
            chmod +x stage/linux-$a/afterglow
            tar -C stage/linux-$a -czf "out/afterglow-$VER-linux-$a.tar.gz" .
          done
          (cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/afterglow-${{ env.VER }}-windows-x86_64.zip
            out/afterglow-${{ env.VER }}-linux-x86_64.tar.gz
            out/afterglow-${{ env.VER }}-linux-aarch64.tar.gz
      # how to use this version, GitHub's list of what changed under it
      - name: notes
        run: |
          {
            echo "**Client:** \`\"@phosphorus/afterglow\": \"github:$GITHUB_REPOSITORY#v$VER\"\`"
            echo
            echo "**Host:** \`afterglow-$VER-windows-x86_64.zip\`, \`afterglow-$VER-linux-x86_64.tar.gz\` and \`afterglow-$VER-linux-aarch64.tar.gz\`, each verified with:"
            echo
            echo '```bash'
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ env.VER }}
          name: afterglow ${{ env.VER }}
          target_commitish: ${{ needs.version.outputs.ref }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: out/*

  # the repo's Actions storage cleared after every run, whatever its outcome: every
  # cache (setup actions' and those older runs left), and every artifact but this run's
  # own when nothing was published, so a build-only or failed run's zip can still be
  # downloaded for the day it's kept. Runs are serialized, so no other run's are in use
  purge:
    needs: [check, windows, linux, publish]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_RUN: ${{ needs.publish.result != 'success' && github.run_id || '' }}
    steps:
      - name: caches
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" -q '.actions_caches[].id')
          for id in $ids; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent || echo "::warning::cache $id not deleted"; done
          echo "deleted $(echo "$ids" | grep -c . || true) caches"
      - name: artifacts
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            -q ".artifacts[] | select((.expired | not) and (.workflow_run.id | tostring) != \"$KEEP_RUN\") | .id")
          for id in $ids; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --silent || echo "::warning::artifact $id not deleted"; done
          echo "deleted $(echo "$ids" | grep -c . || true) artifacts${KEEP_RUN:+, kept the current run}"
