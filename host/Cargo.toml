[package]
name = "afterglow"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Stream a host's apps as low-latency H.264 over one loopback link"
repository = "https://github.com/pmghartman/afterglow"
publish = false

[[bin]]
name = "afterglow"
path = "src/main.rs"

# the Windows service that keeps afterglow.exe running in the console's session
[[bin]]
name = "afterglowsvc"
path = "src/svc.rs"

[dependencies]
serde_json = "1"
miniz_oxide = "0.8"
# glow (src/glow): the viewer served straight over WebTransport, QUIC on UDP
wtransport = { version = "0.7", default-features = false, features = ["ring", "self-signed", "quinn"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
ring = "0.17"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Media",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

# the X11 backend: an X server's screen captured and driven, H.264 from OpenH264.
# What CI and a Linux machine run the real link against
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
openh264-sys2 = "0.9"
x11rb = { version = "0.14", features = ["damage", "randr", "res", "shm", "xtest", "xfixes"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
